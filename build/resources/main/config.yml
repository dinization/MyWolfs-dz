# MyWolfs Configuration File

messages:
  wolf_tamed: "<gold>You tamed a new wolf! It is Level 1."
  confirm_remove: "<red>Are you sure you want to delete %name%? Type /wolf remove %name% confirm to proceed."
  wolf_removed: "<red>You have removed your wolf."
  not_your_wolf: "<red>This wolf does not belong to you!"
  not_looking_at_wolf: "<red>You must be looking at a wolf!"
  level_up: "<green>Your wolf leveled up to Level %level%!"
  no_permission: "<red>You don't have permission to use this command."
  help_message: "<yellow>Usage: /wolf status"
  wolf_renamed: "<green>Wolf renamed to %name%!"
  name_already_in_use: "<red>You already have a wolf named %name%!"
  wolf_not_found: "<red>Wolf not found by that name! <gray>(Make sure the wolf is in your current world)"
  invalid_name: "<red>Invalid name! Use only letters, numbers, and hyphens."
  wolf_limit_reached: "<red>You have reached the maximum number of wolves (%max%)! This new wolf will not level up."
  baby_born: "<yellow>A baby wolf was born! It will remain vanilla and cannot level up."
  list_header: "<gold>=== Your Wolves (%count%) ==="
  list_item: "<yellow>%name% <gray>- Lv.%level% <white>(%location%)"
  list_empty: "<red>You don't have any wolves."
  list_coords: "<white>%x%, %y%, %z%"
  list_world: "<white>%world%"
  list_unloaded: "<gray>Unloaded"
  list_world_only: "<gray>(Showing only wolves in your current world)"
  level_set: "<green>Set %name%'s level to %level%!"
  admin_removed: "<green>Admin: Successfully removed %name%."
  call_success: "<green>%name% has been teleported to you!"
  call_cooldown: "<red>You must wait %time% seconds before calling another wolf."
  call_already_near: "<red>%name% is already close to you!"

  # Help Menu
  help_header: "<gold>=== MyWolfs Commands ==="
  help_ranks: "<yellow>/wolfs ranks [name] <gray>- Shows the RPG ranks of your wolf."
  help_stats: "<yellow>/wolfs stats [name] <gray>- Shows the raw numerical stats."
  help_list: "<yellow>/wolfs list <gray>- Lists all your wolves in the current world."
  help_call: "<yellow>/wolfs call [name] <gray>- Teleports your wolf to you (%cooldown%s cooldown)."
  help_rename: "<yellow>/wolfs rename <oldName> <newName> <gray>- Renames a wolf."
  help_remove: "<yellow>/wolfs remove [name] confirm <gray>- Safely deletes a wolf."
  help_admin_header: "<red>=== Admin Commands ==="
  help_admin_setlevel: "<red>/wolfs admin setlevel <name> <level> <gray>- Sets a wolf's level."
  help_admin_forcerm: "<red>/wolfs admin forcerm <name> <gray>- Instantly deletes a wolf."
  help_footer: "<gray>Tip: If you don't specify a name, the plugin will look at the wolf you are aiming at."
# Ranks and their multipliers
ranks:
  S: 1.5
  A: 1.3
  B: 1.15
  C: 1.0
  D: 0.85
  E: 0.7

# Stat gains per level (Base values multiplied by rank)
stats:
  health_per_level: 0.5
  damage_per_level: 0.1
  speed_per_level: 0.01
  armor_per_level: 0.4

# Maximum number of RPG wolves a player can have
# Wolves tamed beyond this limit will be Level 0 (cannot level up)
max_wolves: 3

# XP required per level (Formula: current_level^exponent * base_xp)
# Example with base 100 and exponent 1.5:
# Lv 1: (1^1.5) * 100 = 100
# Lv 2: (2^1.5) * 100 = 282
# Lv 3: (3^1.5) * 100 = 519
leveling:
  base_xp_required: 100
  exponent: 1.25

# How much XP each mob gives when killed by the wolf
mob_xp:
  # Low xp
  ZOMBIE: 15
  SKELETON: 15
  SPIDER: 12
  SLIME: 10
  SILVERFISH: 5
  ENDERMITE: 5
  CAVE_SPIDER: 15
  DROWNED: 15
  HUSK: 15
  STRAY: 15
  ZOMBIFIED_PIGLIN: 20

  # Medium xp
  CREEPER: 25
  WITCH: 35
  PILLAGER: 25
  VINDICATOR: 35
  EVOKER: 55
  VEX: 20
  PHANTOM: 30
  MAGMA_CUBE: 20
  BLAZE: 50
  WITHER_SKELETON: 55
  GUARDIAN: 35
  ELDER_GUARDIAN: 150
  SHULKER: 40
  ENDERMAN: 60
  PIGLIN_BRUTE: 55
  HOGLIN: 45
  ZOGLIN: 45
  RAVAGER: 100
  IRON_GOLEM: 100

  # Bosses
  ENDER_DRAGON: 5000
  WITHER: 2500
  WARDEN: 2000

  # Default for mobs not in the list
  DEFAULT: 5

  # Settings
  settings:
    call_cooldown_seconds: 30