# ==========================================
# MyWolfs Configuration File
# ==========================================

# --- Ranks and their multipliers ---
ranks:
  S: 1.5
  A: 1.3
  B: 1.15
  C: 1.0
  D: 0.85
  E: 0.7

# --- Stat gains per level (Base values multiplied by rank) ---
stats:
  health_per_level: 1.5
  damage_per_level: 0.2
  speed_per_level: 0.005
  armor_per_level: 0.6

# --- Maximum number of RPG wolves a player can have ---
# Wolves tamed beyond this limit will be Level 0 (cannot level up)
max_wolves: 3

# --- XP required per level (Formula: current_level^exponent * base_xp) ---
leveling:
  base_xp_required: 50
  exponent: 1.20

# --- How much XP each mob gives when killed by the wolf ---
mob_xp:
  # Low xp
  ZOMBIE: 15
  SKELETON: 15
  SPIDER: 12
  SLIME: 10
  SILVERFISH: 5
  ENDERMITE: 5
  CAVE_SPIDER: 15
  DROWNED: 15
  HUSK: 15
  STRAY: 15
  ZOMBIFIED_PIGLIN: 20

  # Medium xp
  ZOMBIE_VILLAGER: 25
  CREEPER: 25
  WITCH: 35
  PILLAGER: 25
  VINDICATOR: 35
  EVOKER: 55
  VEX: 20
  PHANTOM: 30
  MAGMA_CUBE: 20
  BLAZE: 50
  WITHER_SKELETON: 55
  GUARDIAN: 35
  ELDER_GUARDIAN: 150
  SHULKER: 40
  ENDERMAN: 60
  PIGLIN_BRUTE: 60
  HOGLIN: 45
  ZOGLIN: 45
  RAVAGER: 100
  IRON_GOLEM: 100

  # Bosses
  ENDER_DRAGON: 5000
  WITHER: 2500
  WARDEN: 2000

  # Default for mobs not in the list
  DEFAULT: 10

# --- List of items that can be rolled to upgrade a Level 0 wolf ---
upgrade_items:
  - DIAMOND_BLOCK
  - EMERALD_BLOCK
  - GOLDEN_APPLE
  - EXPERIENCE_BOTTLE
  - ENDER_PEARL
  - RABBIT_FOOT

# --- General Settings ---
settings:
  # Utilities:
  autosave_interval_minutes: 5

  # Wolves Settings
  wolf_friendly_fire: false
  call_cooldown_seconds: 20

  # Companions Settings:
  max_foxes: 3
  fox_call_cooldown_seconds: 20

  # Duel Settings
  duels_enabled: true  # Set to false to completely disable the duel system on the server.
  max_duel_wolves: 3
  duel_max_duration_minutes: 5
  duel_challenge_timeout_seconds: 45
  duel_max_distance_blocks: 100
  duel_min_distance_blocks: 30
  duel_preparation_seconds: 5
  duel_wolf_search_radius: 30 # When a duel is about to start, only wolves within this radius are eligible to participate

# --- STATS ROLL SYSTEM ---
stats_roll:
  # Margin of individual variation (RNG) for Health, Damage, and Speed.
  # 0.20 means the final value can roll between -20% and +20% of the variant multiplier.
  global_variance: 0.20

  # Absolute variation for Armor (e.g., 1.0 rolls a value between 0.0 and 1.0).
  armor_variance: 1.0

  # Multipliers per wolf variant.
  variants:
    pale:
      health_mult: 1.00
      damage_mult: 1.00
      speed_mult: 1.00
      armor_flat: 0.0
    woods:
      health_mult: 1.15
      damage_mult: 0.85
      speed_mult: 0.95
      armor_flat: 3.0
    ashen:
      health_mult: 0.95
      damage_mult: 1.10
      speed_mult: 1.10
      armor_flat: 0.0
    black:
      health_mult: 0.90
      damage_mult: 1.40
      speed_mult: 1.00
      armor_flat: 0.0
    chestnut:
      health_mult: 1.10
      damage_mult: 0.90
      speed_mult: 0.90
      armor_flat: 2.0
    rusty:
      health_mult: 1.00
      damage_mult: 1.00
      speed_mult: 1.15
      armor_flat: 0.0
    spotted:
      health_mult: 1.00
      damage_mult: 1.00
      speed_mult: 1.05
      armor_flat: 1.0
    striped:
      health_mult: 1.00
      damage_mult: 1.15
      speed_mult: 1.00
      armor_flat: 0.0
    snowy:
      health_mult: 1.05
      damage_mult: 1.15
      speed_mult: 0.95
      armor_flat: 2.0


# ==========================================
# MESSAGES
# ==========================================

messages:
  # --- General & Errors ---
  no_permission: "<red>You don't have permission to use this command."
  unknown_subcommand: "<red>Unknown subcommand. Usage: /wolfs [stats|list|call|mode|rename|remove|help|admin]"
  world_not_loaded: "<red>The world where the pet is located is not loaded!"
  loading_wolf: "<gray>Loading your wolf from the world..."
  loading_fox: "<gray>Loading your fox from the world..."
  call_not_found: "<red>Could not find your wolf. It might have died or despawned."

  # --- Wolves: Taming & Leveling ---
  wolf_tamed: "<gold>You tamed a new wolf! It is Level 1."
  level_up: "<green>Your wolf leveled up to Level %level%!"
  wolf_limit_reached: "<red>Your pack is full! This wolf was born as a Level 0. Check its Ranks with /wolfs stats to see if it's worth upgrading."
  wolf_overlimit_info: "<yellow>To upgrade this wolf to Level 1, you need: %item%"
  wolf_promoted: "<green>Success! Your wolf is now Level 1."
  wolf_promotion_failed_limit: "<red>You must remove another Level 1+ wolf first to make room!"
  wolf_promotion_wrong_item: "<red>This wolf needs a different item to upgrade."
  baby_born: "<yellow>A baby wolf was born! It will remain vanilla and cannot level up."

  # --- Wolves: Commands ---
  wolf_renamed: "<green>Wolf renamed to %name%!"
  name_already_in_use: "<red>You already have a wolf named %name%!"
  wolf_not_found: "<red>Wolf not found by that name! <gray>(Make sure the wolf is in your current world)"
  invalid_name: "<red>Invalid name! Use only letters, numbers, and hyphens."
  confirm_remove: "<red>Are you sure you want to delete %name%? Type <yellow>/wolfs confirm</yellow> to proceed."
  confirm_expired: "<red>You have no pending removals, or the request expired."
  confirm_unloaded: "<red>The wolf unloaded before confirmation. Please use <yellow>/wolfs call</yellow> to bring it to you first."
  wolf_removed: "<red>You have successfully removed %name%."
  wolf_unloaded_remove: "<red>You cannot remove a wolf that is unloaded! <gray>Use <yellow>/wolfs call %name%</yellow> first."

  # --- Wolves: Calling ---
  call_success: "<green>%name% has been teleported to you!"
  call_success_overlimit: "<green>%name% has been teleported to you! <gray>Remember: This wolf is Level 0. To upgrade it, give it: %item%."
  call_cooldown: "<red>You must wait %time% seconds before calling another wolf."
  call_already_near: "<red>%name% is already close to you!"

  # --- Wolves: Mode ---
  mode_normal: "<green>Your wolf is now in Normal mode."
  mode_aggressive: "<red>Your wolf is now in Aggressive mode! It will attack nearby monsters."
  mode_aggressive_area: "<green>%count% wolves are now in Aggressive mode!"
  mode_normal_area: "<green>%count% wolves are now in Normal mode!"
  wolf_bored: "<gold>[MyWolfs] <yellow>Your wolf got bored and returned to normal mode."
  already_aggressive: "<yellow>This wolf is already in Aggressive mode."
  already_normal: "<yellow>This wolf is already in Normal mode."
  invalid_mode: "<red>Invalid mode. Use 'agg' or 'normal'."

  # --- Foxes ---
  fox_adoption_available: "<gold>A baby fox trusts you! <yellow>Right-click it with Raw Chicken to claim it."
  fox_claimed: "<green>You have successfully claimed the fox as your companion!"
  fox_already_claimed: "<red>This fox already belongs to someone else."
  fox_limit_reached: "<red>You have reached the maximum number of foxes (%max%)!"
  fox_renamed: "<green>Fox renamed to %name%!"
  fox_name_in_use: "<red>You already have a fox named %name%!"
  fox_not_found: "<red>You don't have any fox with that name!"
  fox_call_success: "<green>%name% has been teleported to you!"
  fox_call_cooldown: "<red>You must wait %time% seconds before calling your fox again."
  fox_list_empty: "<red>You don't have any foxes."
  fox_list_header: "<gold>=== Your Foxes (%count%) ==="
  fox_list_item: "<yellow>%name% <white>- %world%"

  # --- Scoreboard ---
  scoreboard_shown: "<green>Showing Top Wolves scoreboard for 20 seconds!"
  scoreboard_hidden: "<red>Scoreboard hidden."

  # --- Stats Menu ---
  stats_header: "<gold>=== %name% (Lv.%level%) ==="
  stats_xp: "<yellow>XP: <white>%xp% / %xp_needed%"
  stats_kills: "<yellow>Kills: <white>%kills%"
  stats_ranks_line: "<yellow>Ranks: <gray>Health: <white>%h% <gray>| Damage: <white>%d% <gray>| Speed: <white>%s% <gray>| Armor: <white>%a%"
  stats_numeric_header: "<gray>--- Real Attributes ---"
  stats_numeric_health: "<red>Health: <white>%current% / %max%"
  stats_numeric_damage: "<dark_red>Damage: <white>%damage%"
  stats_numeric_speed: "<green>Speed: <white>%speed%"
  stats_numeric_armor: "<gray>Armor: <white>%armor%"
  stats_required_item: "<red>Required to upgrade: <white>%item%"

  # --- List Command ---
  list_empty: "<red>You don't have any wolves."
  list_header: "<gold>=== Your Wolves (%count%) ==="
  list_item: "<yellow>%name% <gray>(Lv.%level%) <white>- %world%"

  # --- Duel Messages ---
  duel_challenge_sent: "<green>You have challenged %target% to a duel!"
  duel_challenge_received: "<yellow>%challenger% has challenged you to a duel! <green>Type /wolfs duel accept</green> or <red>/wolfs duel decline</red>."
  duel_challenge_expired: "<red>Your duel challenge to %target% has expired."
  duel_target_offline: "<red>That player is not online."
  duel_already_in_duel: "<red>One of the players is already in a duel."
  duel_self_challenge: "<red>You cannot duel yourself."
  duel_too_close: "<red>You are too close! Move at least %distance% blocks away before accepting."
  duel_disabled: "<red>The duel system is disabled on this server."
  duel_too_far: "<red>You are too far away from the player. the maximum distance is %distance% blocks."
  duel_started: "<gold><bold>DUEL STARTED!</bold></gold>"
  duel_countdown: "<yellow>Starting in %time%..."
  duel_go: "<green><bold>FIGHT!</bold></green>"
  duel_ended_winner: "<gold><bold>DUEL OVER!</bold></gold> <green>%winner% has won the duel!"
  duel_ended_timeout: "<gold><bold>DUEL OVER!</bold></gold> <yellow>Time limit reached! It's a draw."
  duel_ended_forfeit: "<gold><bold>DUEL OVER!</bold></gold> <red>%forfeiter% has forfeited. %winner% wins!"
  duel_ended_disconnect: "<gold><bold>DUEL OVER!</bold></gold> <red>%loser% disconnected. %winner% wins!"
  duel_teleport_warning: "<yellow>Teleporting back to your original position in 4 seconds..."
  duel_command_blocked: "<red>You cannot use commands during a duel! Type /wolfs duel forfeit to give up."
  duel_no_pending: "<red>You have no pending duel challenges."
  duel_declined: "<red>%target% declined your duel request."
  duel_declined_self: "<yellow>You declined the duel request."
  duel_not_in_duel: "<red>You are not currently in a duel."
  duel_wolf_defeated: "<red>%name% was defeated and removed from the duel!"
  duel_support_defeated: "<red>Your support pet was defeated and removed from the duel!"

  # --- Usage Messages ---
  usage_call: "<red>Usage: /wolfs call <name>"
  usage_admin: "<red>Usage: /wolfs <setlevel|forcerm|spawn> [args]"
  usage_setlevel: "<red>Usage: /wolfs setlevel <name> <level>"
  usage_mode: "<red>Usage: /wolfs mode <agg|normal>"
  usage_rename: "<red>Usage: /wolfs rename <oldName> <newName>"
  usage_foxrename: "<red>Usage: /wolfs foxrename <oldName> <newName>"
  usage_foxcall: "<red>Usage: /wolfs foxcall <name>"
  duel_usage: "<red>Usage: /wolfs duel <player> OR /wolfs duel <accept|decline|forfeit>"
  level_not_number: "<red>Level must be a number."
  unknown_admin_action: "<red>Unknown admin action."

  # --- Admin Spawn Messages ---
  admin_spawn_usage: "<red>Usage: /wolfs spawn <wolf|fox>"
  admin_spawn_wolf_success: "<green>Successfully spawned a new RPG Wolf!"
  admin_spawn_fox_success: "<green>Successfully spawned a new RPG Fox!"
  admin_spawn_invalid_type: "<red>Invalid type! Use 'wolf' or 'fox'."
  admin_removed: "<green>Admin: Successfully removed %name%."
  level_set: "<green>Set %name%'s level to %level%!"

  # --- UpdateCheck Messages ---
  update_available: "<yellow>[MyWolfs] <white>A new version is available! <green>%new_version% <gray>(You are on %current_version%)"
  update_download_link: "<click:open_url:'%url%'><blue><u>Click here to download the update</u></blue></click>"

  # --- Help Menu (Page 1: The Basics) ---
  help_header_1: "<gold>=== MyWolfs Guide (1/4) ==="
  help_guide_1_title: "<yellow>🐺 The Wolves:"
  help_guide_1_text: "<gray>When you tame a wild wolf, it gets random <white>Ranks</white> (from S to E) for Health, Damage, Speed, and Armor. S is the best, E is the worst."
  help_guide_1_text2: "<gray>As your wolf kills mobs, it gains <white>XP</white> and levels up. Higher Ranks mean the stats will grow much faster!"
  help_page_next: "<gray>Type <yellow>/wolfs help 2</yellow> to continue reading."

  # --- Help Menu (Page 2: Evolution & Foxes) ---
  help_header_2: "<gold>=== MyWolfs Guide (2/4) ==="
  help_guide_2_title: "<yellow>🦊 Foxes & Evolution:"
  help_guide_2_text: "<gray>There is a limit to how many RPG wolves you can have. If you tame more, they become <white>Level 0</white> and cannot level up."
  help_guide_2_text2: "<gray>However, you can check their Ranks! If they are good, use the item the wolf wants (shown in /wolfs stats) to promote it to Level 1. You must remove an old wolf first to make room."
  help_guide_2_text3: "<gray>To get a <white>Fox</white>, breed two trusted foxes and feed the baby <white>Raw Chicken</white>. They provide a Regeneration aura to your wolves!"
  help_page_next_2: "<gray>Type <yellow>/wolfs help 3</yellow> to see the commands."

  # --- Help Menu (Page 3: Wolf & Fox Commands) ---
  help_header_3: "<gold>=== MyWolfs Commands (3/4) ==="
  help_stats: "<yellow>/wolfs stats [name] <gray>- Shows stats and ranks."
  help_list: "<yellow>/wolfs list <gray>- Lists all your wolves."
  help_call: "<yellow>/wolfs call <name> <gray>- Teleports a wolf (%cooldown%s cd)."
  help_mode: "<yellow>/wolfs mode <agg|normal> [name] <gray>- Changes combat behavior. (Applies to all nearby wolves if no name is given)."
  help_remove: "<yellow>/wolfs remove [name] <gray>- Deletes a wolf."
  help_foxcall: "<yellow>/wolfs foxcall <name> <gray>- Teleports your fox."
  help_foxlist: "<yellow>/wolfs foxlist <gray>- Lists your adopted foxes."
  help_scoreboard: "<yellow>/wolfs scoreboard <gray>- Shows the Top 3 Wolves."
  help_page_next_3: "<gray>Type <yellow>/wolfs help 4</yellow> for duels & admin."

  # --- Help Menu (Page 4: Duels & Admin) ---
  help_header_4: "<gold>=== MyWolfs Commands (4/4) ==="
  help_duel_title: "<yellow>⚔️ Duels:"
  help_duel_text: "<gray>Challenge a player to a pet duel. If they accept, your pets will fight. If a player dies, the death is cancelled."
  help_duel_challenge: "<yellow>/wolfs duel <player> <gray>- Challenges someone."
  help_duel_accept: "<yellow>/wolfs duel accept <gray>- Accepts a challenge."
  help_duel_forfeit: "<yellow>/wolfs duel forfeit <gray>- Gives up the duel."

  help_admin_header: "<red>=== Admin Commands ==="
  help_admin_setlevel: "<red>/wolfs setlevel <name> <level>"
  help_admin_forcerm: "<red>/wolfs forcerm/frm <name>"
  help_admin_spawn: "<red>/wolfs spawn <wolf|fox>"

  help_footer: "<gray>Tip: If you omit a name, the plugin targets the pet you're aiming at."

# Do not change this manually
config_version: '${version}'