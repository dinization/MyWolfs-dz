  help_admin_setlevel: "<red>/wolfs admin setlevel <name> <level> <gray>- Sets a wolf's level."
  help_admin_forcerm: "<red>/wolfs admin forcerm <name> <gray>- Instantly deletes a wolf."

  help_footer: "<gray>Tip: If you don't specify a name, the plugin will look at the wolf you are aiming at."
  help_upgrade_info: "<gray>Over-limit wolves (Level 0) need a specific item to be promoted. Use <yellow>/wolfs ranks</yellow> to see what they need! (you still need to remove another wolf to make room for it)"
  help_foxlist: "<yellow>/wolfs foxlist <gray>- Lists all your foxes and their current world."

# Ranks and their multipliers
ranks:
  S: 1.5
  A: 1.3
  B: 1.15
  C: 1.0
  D: 0.85
  E: 0.7

# Stat gains per level (Base values multiplied by rank)
stats:
  health_per_level: 1.5
  damage_per_level: 0.2
  speed_per_level: 0.005
  armor_per_level: 0.6

# Maximum number of RPG wolves a player can have
# Wolves tamed beyond this limit will be Level 0 (cannot level up)
max_wolves: 3

# XP required per level (Formula: current_level^exponent * base_xp)
# Example with base 100 and exponent 1.5:
# Lv 1: (1^1.5) * 100 = 100
# Lv 2: (2^1.5) * 100 = 282
# Lv 3: (3^1.5) * 100 = 519
leveling:
  base_xp_required: 100
  exponent: 1.25

# How much XP each mob gives when killed by the wolf
mob_xp:
  # Low xp
  ZOMBIE: 15
  SKELETON: 15
  SPIDER: 12
  SLIME: 10
  SILVERFISH: 5
  ENDERMITE: 5
  CAVE_SPIDER: 15
  DROWNED: 15
  HUSK: 15
  STRAY: 15
  ZOMBIFIED_PIGLIN: 20

  # Medium xp
  ZOMBIE_VILLAGER: 25
  CREEPER: 25
  WITCH: 35
  PILLAGER: 25
  VINDICATOR: 35
  EVOKER: 55
  VEX: 20
  PHANTOM: 30
  MAGMA_CUBE: 20
  BLAZE: 50
  WITHER_SKELETON: 55
  GUARDIAN: 35
  ELDER_GUARDIAN: 150
  SHULKER: 40
  ENDERMAN: 60
  PIGLIN_BRUTE: 60
  HOGLIN: 45
  ZOGLIN: 45
  RAVAGER: 100
  IRON_GOLEM: 100

  # Bosses
  ENDER_DRAGON: 5000
  WITHER: 2500
  WARDEN: 2000

  # Default for mobs not in the list
  DEFAULT: 10

# List of items that can be rolled to upgrade a wolf from Level 0 to Level 1
upgrade_items:
  - DIAMOND_BLOCK
  - EMERALD_BLOCK
  - GOLDEN_APPLE
  - EXPERIENCE_BOTTLE
  - ENDER_PEARL
  - RABBIT_FOOT

# Settings
settings:
  # Utilities:
  autosave_interval_minutes: 5

  # Wolves Settings
  wolf_friendly_fire: false
  call_cooldown_seconds: 20

  # Companions Settings:
  max_foxes: 3
  fox_call_cooldown_seconds: 20

# Do not change this manually
config_version: "1.3.0-alpha"